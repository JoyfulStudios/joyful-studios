<!-- OPTIONAL: paste just before </body> in pricing.html.
     Makes the new homepage links (pricing.html#rates, #subscriptions, #weddings)
     open the right tab of the pricing table and scroll to it. -->
<script>
(function () {
  function go() {
    var id = location.hash.replace('#', '');
    var root = document.getElementById('pricing-table');
    if (!root) return;
    function click(sel) { var el = root.querySelector(sel); if (el) el.click(); }
    if (id === 'rates') click('.pricer__panel:not([hidden]) .tl__node[data-period="once"]');
    else if (id === 'subscriptions') click('.pricer__panel:not([hidden]) .tl__node[data-period="6"]');
    else if (id === 'weddings') { click('.pricer__menu [data-cat="wedding"]'); click('.pricer__panel:not([hidden]) .tl__node[data-period="once"]'); }
    else return;
    root.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  window.addEventListener('hashchange', go);
  window.addEventListener('load', go);
})();
</script>
